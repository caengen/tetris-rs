<html lang="en">

<head>
    <meta charset="utf-8">
    <title>tetris.rs</title>
    <style>
        html, body {
            background: rgba(49,47,40, 1);
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }
        /* The game takes its scale from width alone
           (scl = screen_width() / GAME_WIDTH) and lays out GAME_HEIGHT down,
           so the canvas has to be 32:30 or the bottom of the well is cut off.
           miniquad sizes its backing store from this CSS box. */
        canvas {
            padding: 0px;
            width: min(100%, calc(100dvh * 32 / 30));
            aspect-ratio: 32 / 30;
            border-radius: 1rem;
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
    </style>
</head>

<body>
    <canvas id="glcanvas" tabindex='1'></canvas>
    <!--
        Vendored from macroquad v0.3.24 and pinned deliberately:
        https://raw.githubusercontent.com/not-fl3/macroquad/v0.3.24/js/mq_js_bundle.js

        This used to load the unversioned copy at not-fl3.github.io, which has
        since moved to the 0.4 line. That bundle has not created its WebGL
        context by the time a 0.3 binary calls glGetIntegerv, so the game died
        on the first frame with "Cannot read properties of undefined (reading
        'getParameter')". macroquad in Cargo.lock is 0.3.23.

        Re-pin this to match if the crate is ever upgraded.
    -->
    <script src="js/mq_js_bundle.js"></script>
    <script>load("bin/tetris-rs.wasm");</script>
</body>

</html>
